name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill structure and reference links
        run: python .github/scripts/validate_skill.py
      - name: Test contrast calculation and validation failures
        run: python -m unittest discover -s tests -v
